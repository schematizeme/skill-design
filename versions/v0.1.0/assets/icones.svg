<!--
  icones.svg · schematize-design
  Sprite de simbolos SVG inline. Cole o <svg> inteiro logo depois de <body>
  e use <svg class="i"><use href="#i-seta"></use></svg>.

  POR QUE NAO EMOJI NEM DINGBAT: um caractere como ☎ ★ ▶ ⚙ muda de desenho
  por plataforma (no Windows vira preto e branco, no iOS vira emoji colorido),
  muda de largura, e o proprio anti-manual da casa trata emoji como icone como
  marcador de IA. SVG inline e o mesmo desenho em todo lugar, herda a cor do
  texto com currentColor, escala sem borrar, e custa zero requisicao.

  POR QUE NAO FONTE DE ICONE: falha antes do CSS carregar e mostra quadrado,
  e leitor de tela le a letra que esta por tras do glifo.

  Todos os paths usam fill="none" stroke="currentColor" com traco de 1.75,
  entao mudam de cor com `color` e nao precisam de regra propria.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
